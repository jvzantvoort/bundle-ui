version: 2
updates:
  # The actions in .github/workflows (referenced by major version)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The exact versions in requirements.txt. Minor and patch updates come in one
  # grouped pull request; a major update (e.g. Django 6) comes on its own.
  # Security updates are separate pull requests, whatever this schedule says.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-packages:
        update-types: [minor, patch]
    ignore:
      # Stay on Django 5.2 LTS (security fixes until April 2028) rather than
      # 6.0/6.1, which are supported for a shorter time. 5.2.x updates still
      # come. Remove this rule to upgrade, e.g. to the 6.2 LTS.
      - dependency-name: django
        versions: ['>=6']

# The base images in Containerfile and compose.yaml are left out on purpose: a
# new Python or PostgreSQL version (a PostgreSQL major upgrade needs a data
# migration) is a deliberate change, not a routine update.
