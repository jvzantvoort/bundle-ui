{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card login">
  <h1>Log in</h1>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="primary">Log in</button>
  </form>
</div>
{% endblock %}
